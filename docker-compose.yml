services:

  postgres:
    image: postgres:16-alpine

    container_name: production-go-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: production
      POSTGRES_PASSWORD: production
      POSTGRES_DB: production_api

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: